name: Prerelease

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read

jobs:
  promote:
    name: Open develop -> main release PR
    if: ${{ github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: develop
      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   registry.npmjs.org:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "release: v${VERSION}"
            exit 0
          fi
          gh pr create \
            --base main \
            --head develop \
            --title "release: v${VERSION}" \
            --body "Automated promotion of develop to main for v${VERSION}. Merging this PR triggers \`release.yml\` (tag, draft GitHub release, staged npm publish)."
