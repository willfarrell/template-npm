name: Tests (bench)

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: 26.x

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    if: github.event_name == 'pull_request'
    name: Tests (bench)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Build
        run: |
          npm run build --if-present
      - name: Benchmarking tests
        run: |
          node --experimental-bench \
            --bench-reporter=spec \
            --bench-reporter-destination=stdout \
            --bench-reporter=./.github/test-bench-reporter.js \
            --bench-reporter-destination=test-bench-results.json \
            --bench "./**/*.bench.js"
      # allowed-endpoints: >
      #   api.github.com:443
      - name: Check baseline
        id: baseline
        uses: ./.github/actions/gh-reports-branch
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   github.com:443
      - name: Compare & comment
        if: steps.baseline.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: node-bench
          tool: customBiggerIsBetter
          output-file-path: test-bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-reports
          benchmark-data-dir-path: perf
          auto-push: false
          comment-on-alert: true
          summary-always: true
          alert-threshold: '200%'
          fail-on-alert: false

  push:
    if: github.event_name == 'push'
    name: Baseline (bench)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Build
        run: |
          npm run build --if-present
      - name: Benchmarking tests
        run: |
          node --experimental-bench \
            --bench-reporter=spec \
            --bench-reporter-destination=stdout \
            --bench-reporter=./.github/test-bench-reporter.js \
            --bench-reporter-destination=test-bench-results.json \
            --bench "./**/*.bench.js"
      # allowed-endpoints: >
      #   api.github.com:443
      - name: Ensure gh-reports branch
        uses: ./.github/actions/gh-reports-branch
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create: true
      # allowed-endpoints: >
      #   api.github.com:443
      #   github.com:443
      - name: Persist baseline
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: node-bench
          tool: customBiggerIsBetter
          output-file-path: test-bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-reports
          benchmark-data-dir-path: perf
          auto-push: true
          summary-always: true
          alert-threshold: '200%'
          fail-on-alert: false
