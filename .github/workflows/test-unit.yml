name: Tests (unit)

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: 24.x

permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    name: Tests (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      - name: Build
        run: |
          npm run build --if-present
      - name: Unit tests
        run: |
          node --test \
            --experimental-test-coverage \
            --test-coverage-lines=95 \
            --test-coverage-branches=80 \
            --test-coverage-functions=80 \
            --test-reporter=spec \
            --test-reporter=./.github/test-unit-reporter.js \
            --test-reporter-destination=stdout \
            --test-reporter-destination=test-unit-results.json
      - name: Compare & comment
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: coverage
          tool: customBiggerIsBetter
          output-file-path: test-unit-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-reports
          benchmark-data-dir-path: unit
          auto-push: false
          comment-on-alert: true
          summary-always: true
          alert-threshold: '100%'
          fail-on-alert: true

  push:
    if: github.event_name == 'push'
    name: Baseline (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      - name: Build
        run: |
          npm run build --if-present
      - name: Unit tests
        run: |
          node --test \
            --experimental-test-coverage \
            --test-coverage-lines=95 \
            --test-coverage-branches=80 \
            --test-coverage-functions=80 \
            --test-reporter=spec \
            --test-reporter=./.github/test-unit-reporter.js \
            --test-reporter-destination=stdout \
            --test-reporter-destination=test-unit-results.json
      - name: Persist baseline
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: coverage
          tool: customBiggerIsBetter
          output-file-path: test-unit-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-reports
          benchmark-data-dir-path: unit
          auto-push: true
          summary-always: true
          alert-threshold: '100%'
          fail-on-alert: true
      - name: Update coverage badge
        uses: ./.github/actions/test-unit-badge
        with:
          results-file: test-unit-results.json
