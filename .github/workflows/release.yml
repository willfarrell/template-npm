name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  NODE_VERSION: 26.x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # release artifacts must never touch the shared Actions cache
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Set env
        run: |
          tag=$(npm pkg get version | xargs)
          echo "tag=${tag}" >> "$GITHUB_ENV"
          echo "prerelease=$([ "${tag##*-*}" ] && echo false || echo true)" >> "$GITHUB_ENV"
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: Verify dependency signatures
        run: |
          # SPVS V2.6.1 - dependencies fetched from trusted sources, hashes verified
          npm audit signatures
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Build
        run: |
          npm run build --if-present
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Pack
        id: pack
        run: |
          {
            echo "packages<<EOF"
            npm pack --json
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: Build Attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            **/*.tgz
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.tag }}
          path: |
            **/package.json
            **/*.tgz
    outputs:
      tag: ${{ env.tag }}
      prerelease: ${{ env.prerelease }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write # softprops/action-gh-release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.tag }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   uploads.github.com:443
      - name: Release
        # Replaces actions/create-release & actions/upload-release-asset (deprecated)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions] prefer maintained action over inline `gh release` script
        with:
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          tag_name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            **/*.tgz
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      prerelease: ${{ needs.build.outputs.prerelease }}

  coverage:
    name: Coverage badge
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write # push to gh-reports branch
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # gh-reports badge content must never touch the shared Actions cache
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      - name: Run unit tests with LCOV coverage
        run: |
          node --test --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=coverage.lcov
      - name: Compute coverage badge JSON
        run: |
          cat > /tmp/badge.mjs <<'EOF'
          import fs from 'node:fs'
          const lcov = fs.readFileSync('coverage.lcov', 'utf8')
          const sum = (key) => (lcov.match(new RegExp(`^${key}:(\\d+)`, 'gm')) || [])
            .reduce((s, m) => s + parseInt(m.split(':')[1], 10), 0)
          const pct = (h, f) => f === 0 ? 100 : (h * 100) / f
          const lines = pct(sum('LH'), sum('LF'))
          const branches = pct(sum('BRH'), sum('BRF'))
          const fns = pct(sum('FNH'), sum('FNF'))
          const min = Math.floor(Math.min(lines, branches, fns))
          const color =
            min >= 90 ? 'brightgreen' :
            min >= 80 ? 'green' :
            min >= 70 ? 'yellowgreen' :
            min >= 60 ? 'yellow' :
            min >= 50 ? 'orange' : 'red'
          fs.writeFileSync('/tmp/coverage-badge.json', JSON.stringify({
            schemaVersion: 1, label: 'coverage', message: min + '%', color
          }))
          console.log(`lines=${lines.toFixed(1)} branches=${branches.toFixed(1)} fns=${fns.toFixed(1)} min=${min}% color=${color}`)
          EOF
          node /tmp/badge.mjs
      # allowed-endpoints: >
      #   github.com:443
      - name: Publish badge to gh-reports branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin gh-reports >/dev/null 2>&1; then
            git fetch origin gh-reports
            git switch gh-reports
          else
            git switch --orphan gh-reports
          fi
          mkdir -p coverage
          cp /tmp/coverage-badge.json coverage/badge.json
          git add coverage/badge.json
          if git diff --cached --quiet; then
            echo "no badge changes"
          else
            pct=$(jq -r .message coverage/badge.json)
            git commit -m "chore(gh-reports): coverage ${pct}"
            git push -u origin gh-reports
          fi

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: npm-publish

    permissions:
      contents: read
      id-token: write # npm publish
      attestations: read # gh attestation verify
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # release artifacts must never touch the shared Actions cache
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release.outputs.tag }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   tmaproduction.blob.core.windows.net:443
      #   tuf-repo-cdn.sigstore.dev:443
      #   tuf-repo.github.com:443
      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # SPVS V3.4.2 / V4.3.6 - validate artifact integrity before publishing
          find . -name '*.tgz' -print -exec gh attestation verify {} --repo ${{ github.repository }} \;
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   registry.npmjs.org:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: npm stage publish (next)
        if: ${{ needs.release.outputs.prerelease == 'true' }}
        run: |
          find . -name '*.tgz' -exec npm stage publish --tag next --provenance --access public --ignore-scripts {} \;
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   registry.npmjs.org:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: npm stage publish (latest)
        if: ${{ needs.release.outputs.prerelease == 'false' }}
        run: |
          find . -name '*.tgz' -exec npm stage publish --tag latest --provenance --access public --ignore-scripts {} \;
